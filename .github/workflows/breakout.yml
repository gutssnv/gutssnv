name: generate Breakout

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate breakout SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: gutssnv
          games: 'breakout'
          hide_month_labels: 'true'

      # Push the generated SVGs to the output branch
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
